services:
  app:
    build: .
    ports:
      - "${APP_HTTP_PORT:-8080}:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgres://${DB_USERNAME:-docker}:${DB_PASSWORD:-docker}@db:5432/${DB_NAME:-db}
      JWT_SECRET: ${JWT_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
      db-setup:
        condition: service_completed_successfully
    volumes:
      - exercise_uploads:/app/public/images/exercises/uploads
  db:
    image: postgres:16-alpine
    ports:
      - "${DB_EXTERNAL_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${DB_USERNAME:-docker}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-docker}
      POSTGRES_DB: ${DB_NAME:-db}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-docker} -d ${DB_NAME:-db}"]
      interval: 5s
      timeout: 5s
      retries: 10
  db-setup:
    build: .
    command: ["npm", "run", "db:setup"]
    environment:
      DATABASE_URL: postgres://${DB_USERNAME:-docker}:${DB_PASSWORD:-docker}@db:5432/${DB_NAME:-db}
    depends_on:
      db:
        condition: service_healthy
  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      - db
volumes:
  pg-data:
  exercise_uploads:
