services:
  app:
    build: .
    ports:
      - "${APP_HTTP_PORT:-8080}:3000"
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-db}
      DB_USERNAME: ${DB_USERNAME:-docker}
      DB_PASSWORD: ${DB_PASSWORD:-docker}
      SESSION_SECRET: ${SESSION_SECRET:-change-this-secret}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - exercise_uploads:/app/public/images/exercises/uploads
  db:
    image: postgres:16-alpine
    ports:
      - "${DB_EXTERNAL_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${DB_USERNAME:-docker}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-docker}
      POSTGRES_DB: ${DB_NAME:-db}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-docker} -d ${DB_NAME:-db}"]
      interval: 5s
      timeout: 5s
      retries: 10
  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      - db
volumes:
  pg-data:
  exercise_uploads:
